<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stream overlay</title>
    <link rel="stylesheet" href="style.css">
    <script src="libs/matter.js"></script>
    <script src="script.js" defer></script>
</head>
<body bgcolor="black">
    <div class="bg">
        
    </div>
    <div class="top bar">
        
    </div>
    <div class="bottom bar">
        
    </div>
    <div class="left bar">
        <div class="noteArea invis">
            <span id="note"></span>
        </div>
        <div class="chatContainer">
            <div class="header polka">
                <h1>Chat</h1>
            </div>
            <div id="chat">
                
            </div>
        </div>
        <div id="nowPlaying">
            <h1>Now Playing: <span class="artist">minty</span></h1>
            <span class="title">bwaa</span>
            <div class="progressBarContainer">
                <div class="duration">
                    <span class="durationStart">1:10</span>
                    <span class="durationEnd">1:40</span>
                </div>
                <span class="progressBar">
                    <span class="progress"></span>
                </span>
            </div>
        </div>
    </div>
    <div class="adhdContainer">
        <div id="adhd">

        </div>
    </div>

    <div id="templates" class="hidden">
        <div class="msg">
            <span class="msg-upper">
                <span class="msg-author">guhw</span>
                <span class="msg-status">(mod)</span>
            </span>
            <span class="msg-text">hi</span>
        </div>
    </div>
</body>
</html>
